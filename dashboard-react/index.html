<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Interview Atlas</title>
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong palette while the bundle loads. Light is the default.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored !== 'dark') document.documentElement.classList.add('light-theme');
        } catch (e) {
          document.documentElement.classList.add('light-theme');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
